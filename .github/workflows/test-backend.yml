name: Test (backend)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      # for permissions
      - packages/misskey-js/**
      - .github/workflows/test-backend.yml
      - .github/misskey/test.yml
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages/backend/**
      # for permissions
      - packages/misskey-js/**
      - .github/workflows/test-backend.yml
      - .github/misskey/test.yml
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (backend)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version-file:
          - .node-version
          - .github/min.node-version
        include:
          # カバレッジの収集は実行時間が伸びるので、メインのNodeバージョンでのみ行う
          - node-version-file: .node-version
            coverage: true

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 56312:6379
      meilisearch:
        image: getmeili/meilisearch:v1.53.1
        ports:
          - 57712:7700
        env:
          MEILI_NO_ANALYTICS: true
          MEILI_ENV: development

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.10
    - name: Setup FFmpeg cache
      id: ffmpeg-cache
      uses: actions/cache@v6.1.0
      with:
        path: .ci/ffmpeg
        key: ffmpeg-7.0.2-static-linux-x64-ubuntu-latest-25d9b6cc
    - name: Download FFmpeg
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      timeout-minutes: 10
      run: |
        mkdir -p .ci/ffmpeg/bin
        curl -fsSL --retry 3 --max-time 240 -o /tmp/ffmpeg.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz
        curl -fsSL --retry 3 --max-time 240 -o /tmp/ffprobe.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-linux-x64.gz
        echo "bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  /tmp/ffmpeg.gz" | sha256sum -c -
        echo "25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  /tmp/ffprobe.gz" | sha256sum -c -
        gunzip -c /tmp/ffmpeg.gz > .ci/ffmpeg/bin/ffmpeg
        gunzip -c /tmp/ffprobe.gz > .ci/ffmpeg/bin/ffprobe
        chmod +x .ci/ffmpeg/bin/ffmpeg .ci/ffmpeg/bin/ffprobe
    - name: Add FFmpeg to PATH
      run: echo "$GITHUB_WORKSPACE/.ci/ffmpeg/bin" >> "$GITHUB_PATH"
    - name: Verify FFmpeg
      run: |
        ffmpeg -version | head -n 1
        ffprobe -version | head -n 1
    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: ${{ matrix.node-version-file }}
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Check pnpm-lock.yaml
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm build
    - name: Test
      run: pnpm --filter backend ${{ matrix.coverage && 'test-and-coverage' || 'test' }}
    - name: Upload to Codecov
      if: ${{ matrix.coverage }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/backend/coverage/coverage-final.json

  e2e:
    name: E2E tests (backend)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version-file:
          - .node-version
          - .github/min.node-version
        include:
          # カバレッジの収集は実行時間が伸びるので、メインのNodeバージョンでのみ行う
          - node-version-file: .node-version
            coverage: true

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 56312:6379

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ matrix.node-version-file }}
          cache: 'pnpm'
      - run: pnpm i --frozen-lockfile
      - name: Check pnpm-lock.yaml
        run: git diff --exit-code pnpm-lock.yaml
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm --filter backend ${{ matrix.coverage && 'test-and-coverage:e2e' || 'test:e2e' }}
      - name: Upload to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/backend/coverage/coverage-final.json

  migration:
    name: Migration tests (backend)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version-file:
          - .node-version
          #- .github/min.node-version

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
      - name: Get current date
        id: current-date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ matrix.node-version-file }}
          cache: 'pnpm'
      - run: pnpm i --frozen-lockfile
      - name: Check pnpm-lock.yaml
        run: git diff --exit-code pnpm-lock.yaml
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        run: pnpm build
      - name: Run migrations
        run: MISSKEY_CONFIG_YML=test.yml pnpm --filter backend migrate
      - name: Check no migrations are remaining
        run: MISSKEY_CONFIG_YML=test.yml pnpm --filter backend check-migrations
