name: Auto Release and Merge to Master

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
    paths:
      - 'package.json'

permissions:
  contents: write
  # リリースPRの作成・更新に必要
  pull-requests: write
  # リリースPRのheadコミットに付いたCIの結果を読むために必要
  checks: read
  statuses: read
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    # CI待ちの上限(60分)に、PR作成などの前後処理の余裕を加えた値
    timeout-minutes: 90
    # 同じブランチの実行を直列化する。待機中の実行は打ち切らない
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.0
        with:
          fetch-depth: 0
          # developブランチへのバージョン更新のpushに必要
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version from package.json
        id: parse_version
        run: |
          # package.jsonからバージョンを取得
          VERSION=$(jq -r .version package.json)
          echo "Full Version: $VERSION"

          # 'tempura-X.X.X' の部分を抽出（より厳密な正規表現）
          TEMPURA_PART=$(echo "$VERSION" | sed -n 's/.*tempura-\([0-9]\+\.[0-9]\+\.[0-9]\+[^[:space:]]*\).*/\1/p')
          if [ -z "$TEMPURA_PART" ]; then
            echo "::notice::No tempura version found in $VERSION, skipping release creation"
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Tempura Part: $TEMPURA_PART"

          # タグ名を設定
          TAG_NAME="v$TEMPURA_PART"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          # -dev が含まれているかでstableかbetaかを判断
          if [[ "$TEMPURA_PART" == *"-dev"* ]]; then
            IS_STABLE=false
            RELEASE_NAME="Beta Release: $TEMPURA_PART"
          else
            IS_STABLE=true
            RELEASE_NAME="Stable Release: $TEMPURA_PART"
          fi

          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "skip_release=false" >> "$GITHUB_OUTPUT"
          echo "current_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        if: steps.parse_version.outputs.skip_release != 'true'
        id: check_tag
        run: |
          TAG_NAME="${{ steps.parse_version.outputs.tag_name }}"

          # リモートからタグ情報を取得
          git fetch --tags

          # タグが既に存在するかチェック
          if git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG_NAME already exists, skipping release creation"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag $TAG_NAME does not exist, proceeding with release creation"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # developブランチからstableリリースの場合、masterへ直接マージせずリリースPRを作る。
      # 既に開いているdevelop→master PRがあれば再利用する。
      # created=true は「リリースPRが開いていて、この実行ではまだ公開しない」ことを表す
      # (新規作成か再利用かは問わない)。後続の公開系ステップはこの値で抑止する。
      - name: Create or reuse release PR
        if: |
          steps.parse_version.outputs.skip_release != 'true' &&
          steps.check_tag.outputs.tag_exists != 'true' &&
          steps.parse_version.outputs.is_stable == 'true' &&
          steps.parse_version.outputs.current_branch == 'develop'
        id: release_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.parse_version.outputs.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PR_TITLE="Release: ${TAG_NAME}"
          PR_BODY="Release PR for ${TAG_NAME}, created by the Auto Release workflow (${RUN_URL}).

          The workflow waits for CI on the head commit and leaves this PR open. Merge it manually once CI is green; the push to master then publishes the release.

          Note: the workflow waits for every commit status, so Chromatic UI Tests may keep it waiting (pending) until the Chromatic build is reviewed and approved by a human."

          # ブランチ名だけでは同名ブランチを持つforkのPRを拾いうるため、
          # head側のリポジトリ(owner/name)も一致するPRだけを再利用の対象にする
          OPEN_PRS=$(gh pr list \
            --state open \
            --base master \
            --head develop \
            --limit 100 \
            --json number,headRefName,headRepository,headRepositoryOwner)
          EXISTING_PR=$(jq -r \
            --arg owner "$GITHUB_REPOSITORY_OWNER" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            '[.[] | select(.headRefName == "develop" and .headRepositoryOwner.login == $owner and .headRepository.name == $repo)][0].number // ""' \
            <<<"$OPEN_PRS")

          if [ -n "$EXISTING_PR" ]; then
            echo "::notice::Reusing open release PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
            PR_REF="$EXISTING_PR"
          else
            PR_REF=$(gh pr create \
              --base master \
              --head develop \
              --title "$PR_TITLE" \
              --body "$PR_BODY")
            echo "::notice::Created release PR $PR_REF"
          fi

          PR_JSON=$(gh pr view "$PR_REF" --json number,url,headRefOid)
          {
            echo "created=true"
            echo "number=$(jq -r .number <<<"$PR_JSON")"
            echo "url=$(jq -r .url <<<"$PR_JSON")"
            echo "head_sha=$(jq -r .headRefOid <<<"$PR_JSON")"
          } >> "$GITHUB_OUTPUT"

      # リリースPRのheadコミットに付いた既存のpush CIを待つ。PRは成功・失敗どちらでも開いたままにする。
      # - このジョブ自身(github.job)のcheck runは、過去の実行分も含めて待機対象から除外する
      # - 同名のcheck runが複数ある(再実行)場合は、idが最大の最新のrunだけを評価し、古い失敗では落とさない
      # - 必須チェックは「存在して成功」であること。未登録のうちは待ち続ける
      # - それ以外の登録済みcheck/statusは完了を待ち、skipped/neutralは許容し、失敗系は即失敗にする
      # - 完了済みで同一内容のスナップショットが連続して得られたら成功とする
      - name: Wait for release PR CI
        if: steps.release_pr.outputs.created == 'true'
        id: wait_release_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.release_pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
          PR_URL: ${{ steps.release_pr.outputs.url }}
          SELF_CHECK_NAME: ${{ github.job }}
        run: |
          set -uo pipefail

          REQUIRED_JSON='["Production build","check-spdx-license-id"]'
          POLL_INTERVAL=30
          TIMEOUT_SECONDS=3600
          STABLE_REQUIRED=2

          # APIの応答は数百件・数百KBになりうる。コマンドライン引数(MAX_ARG_STRLEN)で渡すと
          # "Argument list too long" になるため、必要なフィールドだけに絞って一時ファイル経由でjqへ渡す
          WORK_DIR=$(mktemp -d) || { echo "::error::Failed to create a temporary directory"; exit 1; }
          trap 'rm -rf -- "${WORK_DIR:?}"' EXIT

          # 1回分のスナップショットを評価し、state/failed/pending/missing_required/fingerprintをJSONで返す
          # 戻り値: 0=成功, 1=API読み取りの失敗(一時的な可能性があるので再試行), 2=ローカルの評価失敗(jq等)
          evaluate() {
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | {id, name, status, conclusion}' \
              > "$WORK_DIR/runs.jsonl" 2> "$WORK_DIR/gh.err" || { head -c 300 "$WORK_DIR/gh.err" >&2; return 1; }
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/statuses?per_page=100" \
              --jq '.[] | {id, context, state, created_at}' \
              > "$WORK_DIR/statuses.jsonl" 2> "$WORK_DIR/gh.err" || { head -c 300 "$WORK_DIR/gh.err" >&2; return 1; }

            jq -n \
              --slurpfile runs "$WORK_DIR/runs.jsonl" \
              --slurpfile statuses "$WORK_DIR/statuses.jsonl" \
              --argjson required "$REQUIRED_JSON" \
              --arg self "$SELF_CHECK_NAME" '
              ["failure", "cancelled", "timed_out", "action_required", "startup_failure", "stale"] as $bad
              | ($runs | map(select(.name != $self))
                  | group_by(.name) | map(sort_by(.id) | last)) as $r
              | ($statuses | group_by(.context) | map(sort_by([.created_at, .id]) | last)) as $s
              | ([$r[] | select(.status == "completed" and (.conclusion as $c | ($bad | index($c)) != null)) | .name]
                  + [$s[] | select(.state == "error" or .state == "failure") | .context]) as $failed
              | ([$r[] | select(.status != "completed") | .name]
                  + [$s[] | select(.state == "pending") | .context]) as $pending
              | ([$required[] | . as $n
                  | select(([$r[] | select(.name == $n and .status == "completed" and .conclusion == "success")] | length) == 0)]) as $missing
              | {
                  state: (if ($failed | length) > 0 then "failed"
                          elif ($pending | length) > 0 or ($missing | length) > 0 then "pending"
                          else "success" end),
                  failed: $failed,
                  pending: $pending,
                  missing_required: $missing,
                  fingerprint: ([$r[] | "check:\(.name):\(.status):\(.conclusion)"]
                                 + [$s[] | "status:\(.context):\(.state)"] | sort | join("|"))
                }' 2> "$WORK_DIR/jq.err" || { head -c 300 "$WORK_DIR/jq.err" >&2; return 2; }
          }

          stable=0
          last_fingerprint=""
          local_errors=0
          while true; do
            eval_rc=0
            result=$(evaluate) || eval_rc=$?
            if [ "$eval_rc" -eq 0 ]; then
              local_errors=0
              state=$(jq -r .state <<<"$result")
              fingerprint=$(jq -r .fingerprint <<<"$result")
              echo "[${SECONDS}s] state=${state} failed=$(jq -c .failed <<<"$result") pending=$(jq -c .pending <<<"$result") missing_required=$(jq -c .missing_required <<<"$result")"

              case "$state" in
                failed)
                  echo "::error::CI failed on release PR head ${HEAD_SHA}: $(jq -c .failed <<<"$result"). The PR stays open: ${PR_URL}"
                  exit 1
                  ;;
                success)
                  if [ "$fingerprint" = "$last_fingerprint" ]; then
                    stable=$((stable + 1))
                  else
                    stable=1
                  fi
                  last_fingerprint="$fingerprint"
                  if [ "$stable" -ge "$STABLE_REQUIRED" ]; then
                    # 成功を宣言する直前にPRのheadを読み直し、待機中にdevelopが進んでいたら成功扱いにしない
                    if ! CURRENT_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid) || [ -z "$CURRENT_HEAD" ]; then
                      echo "::warning::Failed to re-read the head of release PR #${PR_NUMBER}; retrying"
                      stable=0
                      last_fingerprint=""
                    elif [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
                      echo "::error::Release PR #${PR_NUMBER} head moved from ${HEAD_SHA} to ${CURRENT_HEAD} while waiting for CI; not marking it ready. Re-run the workflow to check the new head: ${PR_URL}"
                      exit 1
                    else
                      echo "::notice::CI passed on release PR head ${HEAD_SHA}. Merge the PR manually to publish: ${PR_URL}"
                      exit 0
                    fi
                  fi
                  ;;
                *)
                  stable=0
                  last_fingerprint=""
                  ;;
              esac
            elif [ "$eval_rc" -eq 1 ]; then
              # 一時的なAPI失敗は成功扱いにせず、安定カウントを戻して再試行する
              echo "::warning::Failed to read checks for ${HEAD_SHA}; retrying"
              stable=0
              last_fingerprint=""
            else
              # ローカルの評価失敗(jq等)は決定的な不具合の可能性が高いので、少数回の再試行で明確に失敗させる
              local_errors=$((local_errors + 1))
              echo "::warning::Check evaluation failed locally for ${HEAD_SHA} (${local_errors}/3)"
              stable=0
              last_fingerprint=""
              if [ "$local_errors" -ge 3 ]; then
                echo "::error::Check evaluation failed 3 times in a row on release PR head ${HEAD_SHA}; this is not an API read error. The PR stays open: ${PR_URL}"
                exit 1
              fi
            fi

            if [ "$SECONDS" -ge "$TIMEOUT_SECONDS" ]; then
              echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for CI on release PR head ${HEAD_SHA}. The PR stays open: ${PR_URL}"
              exit 1
            fi
            sleep "$POLL_INTERVAL"
          done

      - name: Generate Release Notes for Stable Release
        if: |
          steps.parse_version.outputs.skip_release != 'true' &&
          steps.check_tag.outputs.tag_exists != 'true' &&
          steps.parse_version.outputs.is_stable == 'true' &&
          steps.release_pr.outputs.created != 'true'
        id: generate_stable_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.parse_version.outputs.tag_name }}
          # タグが指すコミット(マージ済みのmaster)を明示する
          TARGET_COMMITISH: ${{ github.sha }}
        run: |
          # プレリリースではない、最新のリリースのタグ名を取得
          PREVIOUS_STABLE_TAG=$(gh release list \
            --repo ${{ github.repository }} \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""')

          echo "Previous stable tag: $PREVIOUS_STABLE_TAG"

          # リリースノートを生成
          if [ -n "$PREVIOUS_STABLE_TAG" ]; then
            GENERATED_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$NEW_TAG" \
              -f target_commitish="$TARGET_COMMITISH" \
              -f previous_tag_name="$PREVIOUS_STABLE_TAG" \
              --jq '.body')
          else
            # 初回リリースの場合
            GENERATED_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$NEW_TAG" \
              -f target_commitish="$TARGET_COMMITISH" \
              --jq '.body')
          fi

          # マルチライン出力の安全な設定
          {
            echo "notes<<EOF_DELIMITER_$(date +%s)"
            echo "$GENERATED_NOTES"
            echo "EOF_DELIMITER_$(date +%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: |
          steps.parse_version.outputs.skip_release != 'true' &&
          steps.check_tag.outputs.tag_exists != 'true' &&
          steps.release_pr.outputs.created != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse_version.outputs.tag_name }}
          # stableは公開対象のmasterコミットを明示。betaは従来どおり未指定(リポジトリのデフォルトブランチ)
          target_commitish: ${{ steps.parse_version.outputs.is_stable == 'true' && github.sha || '' }}
          name: ${{ steps.parse_version.outputs.release_name }}
          body: ${{ steps.generate_stable_notes.outputs.notes || 'This is a beta (development) release.' }}
          prerelease: ${{ steps.parse_version.outputs.is_stable == 'false' }}
          make_latest: ${{ steps.parse_version.outputs.is_stable == 'true' }}

      # stableリリース後にdevelopブランチのバージョンを次のバージョンに更新
      - name: Update version in develop branch
        if: |
          steps.parse_version.outputs.skip_release != 'true' &&
          steps.check_tag.outputs.tag_exists != 'true' &&
          steps.parse_version.outputs.is_stable == 'true' &&
          steps.release_pr.outputs.created != 'true'
        id: update_version
        run: |
          # Git設定
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # developブランチに切り替え
          git fetch origin develop
          git checkout develop

          # 現在のバージョンを取得
          CURRENT_VERSION=$(jq -r .version package.json)
          echo "Current version: $CURRENT_VERSION"

          # tempura-部分を抽出
          TEMPURA_PART=$(echo "$CURRENT_VERSION" | sed -n 's/.*tempura-\([0-9]\+\.[0-9]\+\.[0-9]\+[^[:space:]]*\).*/\1/p')
          echo "Current tempura part: $TEMPURA_PART"

          # バージョン番号を分割（例：1.9.2）
          IFS='.' read -ra VERSION_PARTS <<< "$TEMPURA_PART"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"

          # パッチバージョンをインクリメント
          NEW_PATCH=$((PATCH + 1))
          NEW_TEMPURA_PART="${MAJOR}.${MINOR}.${NEW_PATCH}-dev"
          echo "New tempura part: $NEW_TEMPURA_PART"

          # 新しいバージョンを構築
          NEW_VERSION=$(echo "$CURRENT_VERSION" | sed "s/tempura-[0-9]\+\.[0-9]\+\.[0-9]\+[^[:space:]]*/tempura-$NEW_TEMPURA_PART/")
          echo "New version: $NEW_VERSION"

          # package.jsonを更新
          jq --arg version "$NEW_VERSION" '.version = $version' package.json > package.json.tmp && mv package.json.tmp package.json

          # misskey-jsのpackage.jsonも更新
          if [ -f "packages/misskey-js/package.json" ]; then
            jq --arg version "$NEW_VERSION" '.version = $version' packages/misskey-js/package.json > packages/misskey-js/package.json.tmp && mv packages/misskey-js/package.json.tmp packages/misskey-js/package.json
          fi

          # 変更をコミット
          git add package.json packages/misskey-js/package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"

          # developブランチにプッシュ
          git push origin develop

          echo "::notice::Successfully updated version to $NEW_VERSION in develop branch"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN起点のpush/releaseイベントでは後続workflowが起動しないため、
      # GHCR公開を明示的にdispatchする（masterへの直接push時はpushトリガーが既に発火するので除く）
      # GHCR公開はmasterのみ。beta(-dev)リリースからは起動しない
      - name: Trigger GHCR image publish
        if: |
          steps.parse_version.outputs.skip_release != 'true' &&
          steps.check_tag.outputs.tag_exists != 'true' &&
          steps.parse_version.outputs.is_stable == 'true' &&
          steps.release_pr.outputs.created != 'true' &&
          !(github.event_name == 'push' && github.ref_name == 'master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ghcr.yml --ref master
          echo "::notice::Dispatched GHCR publish workflow for ref master"

      - name: Output release result
        if: steps.parse_version.outputs.skip_release != 'true'
        run: |
          if [ "${{ steps.release_pr.outputs.created }}" == "true" ]; then
            echo "::notice::Release PR #${{ steps.release_pr.outputs.number }} is ready for manual merge: ${{ steps.release_pr.outputs.url }}"
            echo "::notice::The release will be published when the PR is merged to master"
          elif [ "${{ steps.check_tag.outputs.tag_exists }}" == "true" ]; then
            echo "::notice::Release was skipped because tag ${{ steps.parse_version.outputs.tag_name }} already exists"
          else
            echo "::notice::Successfully created release ${{ steps.parse_version.outputs.release_name }}"
            echo "::notice::Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.parse_version.outputs.tag_name }}"

            # バージョン更新結果も出力
            if [ "${{ steps.parse_version.outputs.is_stable }}" == "true" ]; then
              echo "::notice::Successfully updated version to ${{ steps.update_version.outputs.new_version }} in develop branch"
            fi
          fi
